  try{const r=post?await fetch(cfg.url,{method:'POST',body:JSON.stringify(p),signal:c.signal}):await fetch(cfg.url+'?'+new URLSearchParams(p),{signal:c.signal});j=await r.json()}

/* ---------- Leitor de bolhas (geometria do bloco 10x4: pontos relativos ao centro do quadrado superior esquerdo) ---------- */
function solve(A,B){const n=8,M=A.map((r,i)=>[...r,B[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
  for(let r=0;r<n;r++)if(r!=c){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}}return M.map((r,i)=>r[n]/r[i])}
function lerRGBA(d,w,H){
  let g=new Float32Array(w*H);for(let i=0;i<w*H;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];
  const f=8,sw=Math.ceil(w/f),sh=Math.ceil(H/f),s=new Float32Array(sw*sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let t=0,n=0;for(let j=0;j<f&&y*f+j<H;j++)for(let i=0;i<f&&x*f+i<w;i++){t+=g[(y*f+j)*w+x*f+i];n++}s[y*sw+x]=t/n}
  const r=Math.max(4,Math.round(Math.max(sw,sh)/12));
  const flt=(a,fn)=>{const b=new Float32Array(a.length),o=new Float32Array(a.length);
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let v=a[y*sw+x];for(let i=Math.max(0,x-r);i<=Math.min(sw-1,x+r);i++)v=fn(v,a[y*sw+i]);b[y*sw+x]=v}
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let v=b[y*sw+x];for(let j=Math.max(0,y-r);j<=Math.min(sh-1,y+r);j++)v=fn(v,b[j*sw+x]);o[y*sw+x]=v}return o};
  const bg=flt(flt(s,Math.max),Math.min),m=new Uint8Array(w*H);   /* papel sem sombra = fechamento da imagem reduzida */
  for(let y=0;y<H;y++)for(let x=0;x<w;x++){const i=y*w+x;m[i]=g[i]<.41*Math.max(1,bg[Math.min(sh-1,y/f|0)*sw+Math.min(sw-1,x/f|0)])?1:0}
  const C=[],st=new Int32Array(w*H);
  for(let p=0;p<w*H;p++)if(m[p]==1){let sp=0,A=0,sx=0,sy=0,x0=w,x1=0,y0=H,y1=0;st[sp++]=p;m[p]=2;
    while(sp){const q=st[--sp],x=q%w,y=(q-x)/w;A++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&m[q-1]==1){m[q-1]=2;st[sp++]=q-1}if(x<w-1&&m[q+1]==1){m[q+1]=2;st[sp++]=q+1}
      if(y>0&&m[q-w]==1){m[q-w]=2;st[sp++]=q-w}if(y<H-1&&m[q+w]==1){m[q+w]=2;st[sp++]=q+w}}
    const bw=x1-x0+1,bh=y1-y0+1;if(A>3e-5*w*H&&A<3e-3*w*H&&bw/bh<2&&bh/bw<2&&A/(bw*bh)>.45)C.push({x:sx/A,y:sy/A,a:A})}
  C.sort((a,b)=>b.a-a.a);C.length=Math.min(C.length,28);
  const Q=[];const T=204/282,D=(u,v)=>Math.hypot(u.x-v.x,u.y-v.y);   /* procura os 4 marcadores: retângulo com a proporção do bloco */
  for(let a=0;a<C.length;a++)for(let b=a+1;b<C.length;b++)for(let c=b+1;c<C.length;c++)for(let e=c+1;e<C.length;e++){
    const q=[C[a],C[b],C[c],C[e]],mx=q.reduce((t,p)=>t+p.x,0)/4,my=q.reduce((t,p)=>t+p.y,0)/4;
    q.sort((p,o)=>Math.atan2(p.y-my,p.x-mx)-Math.atan2(o.y-my,o.x-mx));
    let k=0;for(let i=1;i<4;i++)if(q[i].x+q[i].y<q[k].x+q[k].y)k=i;const P=[0,1,2,3].map(i=>q[(k+i)%4]);
    const wt=D(P[0],P[1]),wb=D(P[3],P[2]),hl=D(P[0],P[3]),hr=D(P[1],P[2]),lado=Math.sqrt(q.reduce((t,p)=>t+p.a,0)/4)/((wt+wb)/2);
    if(lado<.03||lado>.08)continue;
    const cr=i=>{const o=P[i],u=P[(i+1)%4],v=P[(i+2)%4];return(u.x-o.x)*(v.y-u.y)-(u.y-o.y)*(v.x-u.x)};
    if(!(cr(0)>0&&cr(1)>0&&cr(2)>0&&cr(3)>0))continue;
    const as=q.map(p=>p.a),err=Math.abs((wt+wb)/(hl+hr)/T-1)+Math.abs(wt-wb)/Math.max(wt,wb)+Math.abs(hl-hr)/Math.max(hl,hr)+(Math.max(...as)/Math.min(...as)-1)*.3;
    Q.push({e:err,P})}
  const amostra=P=>{
  const src=[[0,0],[204,0],[204,282],[0,282]],A=[],B=[];
  P.forEach((p,i)=>{const[u,v]=src[i];A.push([u,v,1,0,0,0,-u*p.x,-v*p.x]);B.push(p.x);A.push([0,0,0,u,v,1,-u*p.y,-v*p.y]);B.push(p.y)});
  const K=solve(A,B),pr=(u,v)=>{const z=K[6]*u+K[7]*v+1;return[(K[0]*u+K[1]*v+K[2])/z,(K[3]*u+K[4]*v+K[5])/z]};
  const gs=(x,y)=>{x=Math.min(w-2,Math.max(0,x));y=Math.min(H-2,Math.max(0,y));const i=x|0,j=y|0,a=x-i,b=y-j,o=j*w+i;return g[o]*(1-a)*(1-b)+g[o+1]*a*(1-b)+g[o+w]*(1-a)*b+g[o+w+1]*a*b};
  const esc=[];let ring=0;
  for(let q=0;q<10;q++){const row=[];for(let a=0;a<4;a++){const cu=56+40*a,cv=55.5+23*q;let t=0,n=0;
    for(let du=-5;du<=5;du+=1.25)for(let dv=-5;dv<=5;dv+=1.25)if(du*du+dv*dv<=25){const[x,y]=pr(cu+du,cv+dv);t+=gs(x,y);n++}
    const wv=[];for(let du=-16;du<=16;du+=4)for(let dv=-9;dv<=9;dv+=3){const[x,y]=pr(cu+du,cv+dv);wv.push(gs(x,y))}
    wv.sort((p,o)=>p-o);const wr=Math.max(1,wv[wv.length>>1]);let rt=0;for(let k=0;k<8;k++){const[x,y]=pr(cu+7.2*Math.cos(k*.785),cv+7.2*Math.sin(k*.785));rt+=gs(x,y)}ring+=1-rt/8/wr;row.push(Math.max(0,1-t/n/Math.max(1,wv[wv.length>>1])))}esc.push(row)}
  const resp=[],fl=[];
  esc.forEach(l=>{const mx=Math.max(...l),mk=l.map((v,i)=>v>=.18&&v>=.55*mx?i:-1).filter(i=>i>=0),so=[...l].sort((a,b)=>b-a);
    resp.push(!mk.length?'.':mk.length>1?'*':'ABCD'[mk[0]]);fl.push(mk.length!=1||mx<.3||(so[1]>.12&&so[1]>.4*mx))});
  if(ring/40<.18)return null;
  return{resp,fl}};
  Q.sort((a,b)=>a.e-b.e);for(const c of Q.slice(0,8)){if(c.e>.5)break;const r=amostra(c.P);if(r)return r}return null}
function lerImagem(im){const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),H=Math.round(im.height*k),c=document.createElement('canvas');
  c.width=w;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,w,H);return lerRGBA(x.getImageData(0,0,w,H).data,w,H)}

/* ---------- Telas ---------- */
function conf(){const novo=!cfg.url;h(`${novo?`<div class=hero>${IC.logo}<div class=wm>syntese</div><small style="margin:6px 0 0">Soluções para docentes</small></div>`:'<h1>Conexão</h1>'}<label>Endereço do script (termina em /exec)</label><input id=u value="${cfg.url||''}" autocapitalize=off>
<label>Chave</label><input id=k type=password value="${cfg.chave||''}"><button onclick=salvaCfg()>${novo?'Entrar':'Testar e salvar'}</button>${cfg.url?'<button class=g onclick=ajustes()>Voltar</button>':''}`,'ajustes')}
async function salvaCfg(){const o=cfg;cfg={url:$('#u').value.trim(),chave:$('#k').value.trim()};
  try{const j=await api('ping');LS.cfg=JSON.stringify(cfg);msg('Conectado: '+j.planilha);inicio()}catch{cfg=o}}
async function home(){if(!cfg.url)return conf();h('<p>Carregando…</p>');
  try{const[t,s]=await Promise.all([lerC('turmas'),lerC('simulados')]);S.turmas=t.turmas;S.sims=s.simulados;if(t.cache||s.cache)msg('Sem internet: usando dados guardados.')}catch{return conf()}
  if(!S.turmas.length||!S.sims.length)return h(`<h1>Vamos começar</h1><p>Para corrigir, o Syntese precisa de ${!S.turmas.length?'uma turma com alunos':''}${!S.turmas.length&&!S.sims.length?' e ':''}${!S.sims.length?'um gabarito':''}.</p>${!S.turmas.length?'<button onclick=turmasTela()>Cadastrar turma e alunos</button>':''}${!S.sims.length?`<button class="${S.turmas.length?'':'g'}" onclick=gabNovo()>Cadastrar gabarito</button>`:''}<button class=g onclick=home()>Tentar de novo</button>`,'corrigir');
  h(`<h1 class=ti>${IC.logo}<span>syntese</span></h1><small style="margin:-8px 0 6px">Soluções para docentes</small><div id=pb>${pend()}</div><label>Turma</label><select id=tu onchange="setTurma(this.value)">${S.turmas.map(x=>`<option ${x==turmaAtiva()?'selected':''}>${x}</option>`).join('')}</select>
  <label>Simulado</label><select id=si onchange=tipos()>${S.sims.map(x=>`<option>${x.simulado}</option>`).join('')}</select>
  <label>Tipo da prova</label><div id=tp></div><button onclick=ini()>Iniciar leitura</button><button class=g onclick=turmasTela()>Turmas e alunos</button>`,'corrigir');tipos()}
function tipos(){const s=S.sims.find(x=>x.simulado==$('#si').value);if(!s.tipos.includes(S.tipo))S.tipo=s.tipos[0];
  $('#tp').innerHTML=s.tipos.map(t=>`<button class="s ${t==S.tipo?'on':''}" onclick="S.tipo='${t}';tipos()">Tipo ${t}</button>`).join('')}
async function ini(){S.turma=$('#tu').value;S.sim=$('#si').value;S.cont=0;try{S.gab=(await lerC('gabarito',{simulado:S.sim})).tipos}catch{return}lerC('alunosSit',{turma:S.turma,simulado:S.sim}).catch(()=>{});leitura()}
function leitura(){h(`<div class=bar><b>${S.turma}</b> · ${S.sim}<br><span class=badge>TIPO ${S.tipo}</span>${S.gab.map(g=>`<button class="s ${g.tipo==S.tipo?'on':''}" onclick="S.tipo='${g.tipo}';leitura()">${g.tipo}</button>`).join('')}
  <span style="float:right">${S.cont} lidas</span></div>
  <input id=f type=file accept="image/*" capture=environment hidden onchange=foto(this)><input id=f2 type=file accept="image/*" hidden onchange=foto(this)>
  <button class=ic onclick=f.click()>${IC.cam}Fotografar prova</button><button class=g onclick=f2.click()>Escolher da galeria</button>
  ${S.ult?'<button class=g onclick=desfaz()>Desfazer última nota</button>':''}<div id=pb>${pend()}</div><button class=g onclick=home()>Trocar turma / simulado</button>
  <small>Folha na vertical, boa luz, sem sombra. Os 4 quadrados pretos do gabarito precisam aparecer na foto.</small>`,'corrigir')}
async function foto(i){const f=i.files[0];if(!f)return;msg('Lendo…');
  const im=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f));
  let r;try{r=lerImagem(im)}catch(e){r=null}i.value='';
  if(!r){h('<h1>Não consegui ler</h1><p>Não encontrei os 4 quadrados pretos do gabarito. Tente de novo mais perto, com a folha reta e sem sombra, mostrando o bloco inteiro.</p><button onclick=leitura()>Tirar outra foto</button>');return}
  S.r=r;res()}
const nota=g=>S.r.resp.reduce((a,l,i)=>a+(g.respostas[i]=='ANULADA'||l==g.respostas[i]),0);
function res(){navAtivo(null);const g=S.gab.find(x=>x.tipo==S.tipo),a=nota(g),o=S.gab.find(x=>x.tipo!=S.tipo),ao=o?nota(o):0,nt=Math.round(a/g.questoes*g.notaMax*100)/100;
  h(`<div class=bar><span class=badge>TIPO ${S.tipo}</span> <b>${a}/${g.questoes} · nota ${nt}</b></div>
  ${o&&ao-a>=4?`<div class=w>Atenção: esta folha combina mais com o tipo ${o.tipo} (${ao} acertos). Confira a pilha.</div>`:''}
  ${S.r.resp.map((l,i)=>`<div class="q ${S.r.fl[i]?'f':''}"><b>Q.${i+1}</b>${'ABCD'.split('').map(x=>`<button class="${l==x?'on':''}" onclick="ed(${i},'${x}')">${x}</button>`).join('')}<button class="${l=='.'||l=='*'?'on':''}" onclick="ed(${i},'.')">${l=='*'?'✱':'—'}</button></div>`).join('')}
  <small>Linhas amarelas: em branco, mais de uma marca ou marca fraca. Toque na letra para corrigir.</small>
  <button onclick=alunos()>Escolher aluno</button><button class=g onclick=leitura()>Descartar e refazer foto</button>`)}
function ed(i,x){S.r.resp[i]=x;S.r.fl[i]=false;res()}
async function alunos(){navAtivo(null);let L;try{L=(await lerC('alunosSit',{turma:S.turma,simulado:S.sim})).alunos.filter(a=>!a.arq)}catch{return}
  FILA.forEach(q=>{if(q.sim==S.sim){const a=L.find(x=>x.id==q.id);if(a){a.jaTem=true;a.nota='na fila'}}});L.sort((a,b)=>a.jaTem-b.jaTem||a.nome.localeCompare(b.nome));S.L=L;
  h(`<h1>Quem é o aluno?</h1><input id=bs placeholder="Buscar nome…" oninput=lista()><div id=ls></div><button class=g onclick=res()>Voltar</button>`);lista()}
function lista(){const b=($('#bs').value||'').toLowerCase();
  $('#ls').innerHTML=S.L.filter(a=>a.nome.toLowerCase().includes(b)).map(a=>`<button class="g al ${a.jaTem?'ok':''}" onclick="salva('${a.id}')"><span>${a.nome}</span><span>${a.jaTem?'✓ '+a.nota:''}</span></button>`).join('')}
async function salva(id,sub){let j;try{j=await api('salvarNota',{simulado:S.sim,tipo:S.tipo,id,respostas:S.r.resp.map(l=>l||'.').join(''),substituir:!!sub},true,1)}catch(e){if(e.rede)return enfileira(id);return}
  if(j.conflito){if(confirm(`Este aluno já tem nota (${j.notaAnterior}). Substituir?`))return salva(id,true);return}
  FILA=FILA.filter(q=>!(q.sim==S.sim&&q.id==id));salvaFila();S.ult={sim:S.sim,id};if(!j.substituiu)S.cont++;msg(`${j.aluno}: ${j.acertos} acertos · nota ${j.nota}`);leitura();sincroniza()}
async function desfaz(){if(!confirm('Apagar a última nota lançada?'))return;if(S.ult.fila){FILA=FILA.filter(q=>!(q.sim==S.ult.sim&&q.id==S.ult.id));salvaFila();S.cont=Math.max(0,S.cont-1);S.ult=null;msg('Nota removida da fila');return leitura()}try{await api('excluirNota',{simulado:S.ult.sim,id:S.ult.id},true);S.cont=Math.max(0,S.cont-1);S.ult=null;msg('Nota apagada');leitura()}catch{}}
/* ---------- Cadastro de gabarito ---------- */
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let G={};
function gabNovo(){S.sims=S.sims||[];G={sim:'',tipo:'A',nota:'',resp:Array(10).fill(''),fl:Array(10).fill(false)};gabForm()}
function gabLinha(i){const l=G.resp[i];return `<div id=gq${i} class="q ${G.fl[i]?'f':''}"><b>Q.${i+1}</b>${'ABCD'.split('').map(x=>`<button class="${l==x?'on':''}" onclick="gabEd(${i},'${x}')">${x}</button>`).join('')}<button class="an ${l=='ANULADA'?'on':''}" onclick="gabEd(${i},'ANULADA')">Anul.</button></div>`}
function gabForm(){h(`<h1>Cadastrar gabarito</h1>
  <label>Nome do simulado</label><input value="${esc(G.sim)}" list=dl oninput="gabNome(this.value)" autocapitalize=off placeholder="Ex.: Simulado 4.1 - 8º A">
  <datalist id=dl>${(S.sims||[]).map(x=>`<option value="${esc(x.simulado)}">`).join('')}</datalist>
  <label>Tipo da prova</label><div>${['A','B'].map(t=>`<button class="s ${t==G.tipo?'on':''}" onclick="G.tipo='${t}';gabForm()">Tipo ${t}</button>`).join('')}</div>
  <label>Nota máxima</label><input id=gm type=number inputmode=decimal step=any value="${esc(G.nota)}" oninput="G.nota=this.value" placeholder="Ex.: 5">
  <div id=gw></div><label>Respostas (10 questões, 4 alternativas)</label>
  ${G.resp.map((l,i)=>gabLinha(i)).join('')}
  <input id=gf type=file accept="image/*" hidden onchange=gabFoto(this)>
  <button class="g ic" onclick=gf.click()>${IC.cam}Preencher com folha-modelo</button>
  <small>Tire a foto de uma folha com o gabarito marcado. Questões em branco, com mais de uma marca ou com marca fraca ficam em amarelo para você conferir. Toque na letra para corrigir; toque de novo para limpar.</small>
  <button onclick=gabSalva()>Salvar gabarito</button><button class=g onclick=home()>Voltar</button>`,'gab');gabAviso()}
function gabNome(v){G.sim=v;const e=S.sims.find(x=>x.simulado==v.trim());if(e&&!G.nota){G.nota=e.notaMax;$('#gm').value=e.notaMax}gabAviso()}
function gabAviso(){const e=S.sims.find(x=>x.simulado==G.sim.trim());
  $('#gw').innerHTML=e&&e.tipos.includes(G.tipo)?`<div class=w>Este simulado já tem o tipo ${G.tipo}. Salvar vai substituir o gabarito (as notas já lançadas não são recalculadas).</div>`:''}
function gabEd(i,x){G.resp[i]=G.resp[i]==x?'':x;G.fl[i]=false;$('#gq'+i).outerHTML=gabLinha(i)}
async function gabFoto(i){const f=i.files[0];if(!f)return;msg('Lendo…');
  const im=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f));
  let r;try{r=lerImagem(im)}catch(e){r=null}i.value='';
  if(!r)return msg('Não achei os 4 quadrados. Tente de novo, com o bloco inteiro na foto.');
  let n=0;r.resp.forEach((l,k)=>{const ok=/^[A-D]$/.test(l);G.resp[k]=ok?l:'';G.fl[k]=!ok||r.fl[k];if(G.fl[k])n++});
  gabForm();msg(n?n+' questão(ões) para conferir (em amarelo).':'Gabarito lido. Confira antes de salvar.')}
async function gabSalva(){const sim=G.sim.trim(),nota=Number(String(G.nota).replace(',','.'));
  if(!sim)return msg('Informe o nome do simulado.');
  if(!(nota>0))return msg('Informe a nota máxima.');
  const f=[];G.resp.forEach((l,i)=>{if(!l){f.push(i+1);G.fl[i]=true}});
  if(f.length){gabForm();return msg('Faltam respostas: Q.'+f.join(', Q.'))}

function abreSel(s,pinta){const ov=document.createElement('div'),sh=document.createElement('div');ov.className='ov';sh.className='sh';
  ov.onclick=e=>{if(e.target==ov)ov.remove()};
  [...s.options].forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='op'+(i==s.selectedIndex?' on':'');b.textContent=o.text;
    b.onclick=()=>{s.selectedIndex=i;s.dispatchEvent(new Event('change'));pinta();ov.remove()};sh.appendChild(b)});
  ov.appendChild(sh);document.body.appendChild(ov)}

async function planTela(){h('<h1>Planilha</h1><p>Carregando…</p>','ajustes');let j;
  try{j=await api('planilha')}catch(e){if(LS.plan)j={url:LS.plan};else return ajustes()}

  <small>Os dados do Syntese ficam nessa planilha. Evite renomear as abas e os cabeçalhos.</small><button class=g onclick=ajustes()>Voltar</button>`,'ajustes')}

/* ---------- Provas: banco de questões e catálogo de habilidades ---------- */
const KV='0.18.11';let KT=null;
/* As fórmulas usam katex.js e katex.css, guardados junto do app (com a nuvem como reserva).
   O nome da função é outro de propósito: a biblioteca cria um "katex" global e substituía a função antiga. */
function carregaKatex(){return KT||(KT=new Promise((ok,no)=>{
  const L=u=>new Promise((r,j)=>{const t=document.createElement('script');t.src=u;t.onload=r;t.onerror=j;document.head.appendChild(t)}),
    css=u=>{const c=document.createElement('link');c.rel='stylesheet';c.href=u;document.head.appendChild(c)},
    N='https://cdn.jsdelivr.net/npm/katex@'+KV+'/dist/';
  css('katex.css');
  L('katex.js').catch(()=>{css(N+'katex.min.css');return L(N+'katex.min.js').then(()=>L(N+'contrib/auto-render.min.js'))}).then(ok,e=>{KT=null;no(e)})}))}
let matAviso=0;
async function mat(el){try{await carregaKatex();window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
  catch(e){if(!matAviso){matAviso=1;msg('Não consegui carregar as fórmulas. Verifique a internet.')}}}
const tx=t=>esc(t).replace(/\n/g,'<br>');
let Q={L:[],H:[],f:{b:'',s:'',st:'ativa'},e:null};
function provasTela(){h(`<h1>Avaliações</h1>${AJ('irCorrigir()','Corrigir por foto')}${AJ('irRes()','Resultados')}${AJ('qBanco()','Banco de questões')}${AJ('gabNovo()','Gabaritos')}${AJ('habTela()','Habilidades (BNCC e Saeb)')}`,'gab')}
async function qBanco(){try{const[a,b]=await Promise.all([api('questoes'),api('habilidades')]);Q.L=a.questoes;Q.H=b.habilidades}catch{return}qTela()}
function qTela(){h(`<h1>Banco de questões</h1><input placeholder="Buscar no enunciado, assunto ou habilidade" value="${esc(Q.f.b)}" oninput="Q.f.b=this.value;qLista()">
  <select onchange="Q.f.s=this.value;qLista()"><option value="">Todas as séries</option>${[1,2,3,4,5,6,7,8,9].map(n=>`<option value="${n}" ${Q.f.s==n?'selected':''}>${n}º ano</option>`).join('')}</select>
  <div><button class="s ${Q.f.st=='arquivada'?'on':''}" onclick="Q.f.st=Q.f.st=='ativa'?'arquivada':'ativa';qTela()">${Q.f.st=='ativa'?'Ver arquivadas':'Voltar às ativas'}</button></div>
  <div id=ql></div><button onclick=qEd()>Nova questão</button><button class=g onclick=provasTela()>Voltar</button>`,'gab');qLista()}
function qLista(){const f=Q.f,b=f.b.toLowerCase().trim(),L=Q.L.filter(q=>q.status==f.st&&(!f.s||q.serie==f.s)&&(!b||[q.enunciado,q.assunto,q.bncc,q.saeb,q.id].join(' ').toLowerCase().includes(b)));
  $('#ql').innerHTML=L.length?L.slice().reverse().map(q=>`<button class="g al" data-i="${esc(q.id)}" onclick="qEd(this.dataset.i)"><span>${esc(q.enunciado.replace(/\$/g,'').slice(0,90))}${q.enunciado.length>90?'…':''}<small>${[q.id,q.serie&&q.serie+'º ano',q.tipo=='discursiva'&&'discursiva',q.figura&&'figura',q.bncc,q.saeb,q.nivel&&'nível '+q.nivel].filter(Boolean).map(esc).join(' · ')}</small></span><span>›</span></button>`).join(''):'<p>Nenhuma questão encontrada.</p>'}
async function qStatus(id,st){try{await api('statusQuestao',{id,status:st},true)}catch{return}msg(st=='arquivada'?'Questão arquivada':'Questão restaurada');qBanco()}
async function habTela(){let j;try{j=(await api('habilidades')).habilidades}catch{return}Q.H=j;const n=r=>j.filter(x=>x.ref==r).length;
  h(`<h1>Habilidades</h1><p>Cadastradas: BNCC ${n('BNCC')} · Saeb 2025 (9º ano) ${n('SAEB9')}</p><label>Tipo de lista</label><select id=hr><option value="BNCC">BNCC</option><option value="SAEB9">Matriz do Saeb 2025 (9º ano)</option></select>
  <label>Lista: uma habilidade por linha, com o código e depois a descrição</label><textarea id=hl rows=10></textarea><input type=file accept=".txt,.csv,.tsv" onchange="habArq(this)">
  <button onclick=habImp()>Importar</button><button class=g onclick=provasTela()>Voltar</button>
  <small>Cole a lista copiada do documento oficial (BNCC do MEC ou Matriz do Saeb do Inep), ou escolha um arquivo .txt, .csv ou .tsv. Também vale código, tabulação (ou ponto e vírgula) e descrição, ou código, eixo e descrição. Importar de novo atualiza as que já existem.</small>`,'gab')}
async function habArq(i){const f=i.files[0];if(f)$('#hl').value=await f.text()}
function habParse(t,ref){return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{let c,d,eixo='';const sep=l.includes('\t')?'\t':l.includes(';')?';':null;
  if(sep){const p=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));c=p[0];d=p[p.length-1];if(p.length>2)eixo=p[1]}
  else{const m=l.match(/^[\(\[]?([^\s\)\]]+)[\)\]]?\s*[-–:.]?\s*(.+)$/);if(!m)return null;c=m[1];d=m[2]}
  c=(c||'').replace(/[\(\)\[\]:;,]+$/,'');return c&&d&&c!=d&&/\d/.test(c)?{ref,codigo:c,eixo,descricao:d}:null}).filter(Boolean)}
async function habImp(){const it=habParse($('#hl').value,$('#hr').value);if(!it.length)return msg('Não encontrei habilidades no texto.');
  if(!confirm(`Importar ${it.length} habilidade(s)?\nExemplo: ${it[0].codigo} — ${it[0].descricao.slice(0,60)}`))return;let j;
  try{j=await api('importarHabilidades',{itens:it},true)}catch{return}msg(`${j.adicionadas} adicionada(s), ${j.atualizadas} atualizada(s)`);habTela()}
/* ---------- Ponte com as extensões do Chrome (Lançador de Notas e, depois, de Aulas) ---------- */

let EXT={};
addEventListener('message',e=>{const m=e.data;if(e.source!==window||e.origin!==location.origin||!m||typeof m!='object')return;
  if(m.tipo=='syntese-pong'){EXT[m.extensao]=m.versao;expMarca()}
  else if(m.tipo=='syntese-aulas-resultado')aulaEnviada(m);
  else if(m.tipo=='syntese-notas-resultado')msg(m.ok?m.recebidas+' nota(s) enviada(s). Abra a extensão na página de notas da plataforma e clique em Carregar notas.':'Erro no envio: '+m.erro)});
const pingExt=()=>postMessage({tipo:'syntese-ping'},location.origin);
function expMarca(){const e=$('#exs');if(e)e.textContent=EXT.notas?'Lançador de Notas detectado (versão '+EXT.notas+').':'Lançador de Notas não detectado. Ele funciona no Chrome do computador, com a extensão instalada.'}
function expExt(){if(!EXT.notas)return msg('Não encontrei o Lançador de Notas neste navegador.');const d=expDados();
  postMessage({tipo:'syntese-notas',versao:1,simulado:NT.sim,turma:NT.turma,notas:d.linhas.slice(1).map(r=>({nome:r[0],nota:r[2]===''?null:r[2]}))},location.origin)}
pingExt();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('online',()=>sincroniza());
let spOk=false;function fimSp(){if(spOk)return;spOk=true;const e=$('#sp');if(!e)return;setTimeout(()=>{e.classList.add('x');setTimeout(()=>e.remove(),450)},Math.max(0,1700-(Date.now()-T0)))}
setTimeout(fimSp,9000);
if(LS.bio){trava();bioOk().then(ok=>{if(ok)livre()})}
inicio().then(()=>{fimSp();sincroniza()});
setTimeout(()=>Object.keys(MODS).forEach(m=>carrega(m,1).catch(()=>{})),4000);
