<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1F3864"><title>Correção de Gabaritos</title>
<style>
:root{--bg:#f4f5f7;--tx:#1b1f24;--pr:#1F3864;--ca:#fff;--bd:#d0d4da;--am:#fff3bf}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--tx:#e8eaed;--ca:#1f242b;--bd:#39414b;--am:#5c4b0a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:560px;margin:auto;padding:14px}h1{font-size:20px;margin:4px 0 12px}
button,select,input{font:inherit;width:100%;padding:13px;margin:5px 0;border-radius:10px;border:1px solid var(--bd);background:var(--ca);color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;font-weight:600}button.g{background:var(--ca);color:var(--tx);border:1px solid var(--bd)}
button.s{width:auto;padding:8px 16px;margin:2px}button.on{background:var(--pr);color:#fff}
label{font-size:13px;opacity:.75;margin-top:8px;display:block}.bar{background:var(--ca);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.badge{display:inline-block;background:#c0392b;color:#fff;font-weight:700;border-radius:8px;padding:4px 12px;margin-right:6px}
.q{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px}.q.f{background:var(--am)}.q b{width:44px}
.q button{width:auto;flex:1;padding:9px 0;margin:0;background:var(--ca);color:var(--tx);border:1px solid var(--bd)}.q button.on{background:var(--pr);color:#fff}
.al{display:flex;justify-content:space-between;text-align:left}.al.ok{opacity:.45}small{opacity:.7;display:block;margin-top:8px}
#t{position:fixed;left:12px;right:12px;bottom:14px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9}
.w{background:var(--am);padding:10px;border-radius:8px;margin:6px 0}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=q=>document.querySelector(q),LS=localStorage,h=s=>$('#app').innerHTML=s;
let cfg=JSON.parse(LS.cfg||'{}'),S={tipo:'A',gab:[],cont:0};
const msg=t=>{const e=$('#t');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000)};
async function api(acao,p={},post){p={...p,acao,chave:cfg.chave};
  try{const r=post?await fetch(cfg.url,{method:'POST',body:JSON.stringify(p)}):await fetch(cfg.url+'?'+new URLSearchParams(p));
    const j=await r.json();if(!j.ok)throw new Error(j.erro);return j}catch(e){msg('Erro: '+e.message);throw e}}

/* ---------- Leitor de bolhas (geometria do bloco 10x4: pontos relativos ao centro do quadrado superior esquerdo) ---------- */
function solve(A,B){const n=8,M=A.map((r,i)=>[...r,B[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
  for(let r=0;r<n;r++)if(r!=c){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}}return M.map((r,i)=>r[n]/r[i])}
function lerRGBA(d,w,H){
  let g=new Float32Array(w*H);for(let i=0;i<w*H;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];
  const f=8,sw=Math.ceil(w/f),sh=Math.ceil(H/f),s=new Float32Array(sw*sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let t=0,n=0;for(let j=0;j<f&&y*f+j<H;j++)for(let i=0;i<f&&x*f+i<w;i++){t+=g[(y*f+j)*w+x*f+i];n++}s[y*sw+x]=t/n}
  const r=Math.max(4,Math.round(Math.max(sw,sh)/12));
  const flt=(a,fn)=>{const b=new Float32Array(a.length),o=new Float32Array(a.length);
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let v=a[y*sw+x];for(let i=Math.max(0,x-r);i<=Math.min(sw-1,x+r);i++)v=fn(v,a[y*sw+i]);b[y*sw+x]=v}
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let v=b[y*sw+x];for(let j=Math.max(0,y-r);j<=Math.min(sh-1,y+r);j++)v=fn(v,b[j*sw+x]);o[y*sw+x]=v}return o};
  const bg=flt(flt(s,Math.max),Math.min),m=new Uint8Array(w*H);   /* papel sem sombra = fechamento da imagem reduzida */
  for(let y=0;y<H;y++)for(let x=0;x<w;x++){const i=y*w+x;m[i]=g[i]<.41*Math.max(1,bg[Math.min(sh-1,y/f|0)*sw+Math.min(sw-1,x/f|0)])?1:0}
  const C=[],st=new Int32Array(w*H);
  for(let p=0;p<w*H;p++)if(m[p]==1){let sp=0,A=0,sx=0,sy=0,x0=w,x1=0,y0=H,y1=0;st[sp++]=p;m[p]=2;
    while(sp){const q=st[--sp],x=q%w,y=(q-x)/w;A++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&m[q-1]==1){m[q-1]=2;st[sp++]=q-1}if(x<w-1&&m[q+1]==1){m[q+1]=2;st[sp++]=q+1}
      if(y>0&&m[q-w]==1){m[q-w]=2;st[sp++]=q-w}if(y<H-1&&m[q+w]==1){m[q+w]=2;st[sp++]=q+w}}
    const bw=x1-x0+1,bh=y1-y0+1;if(A>3e-5*w*H&&A<3e-3*w*H&&bw/bh<2&&bh/bw<2&&A/(bw*bh)>.45)C.push({x:sx/A,y:sy/A,a:A})}
  C.sort((a,b)=>b.a-a.a);C.length=Math.min(C.length,28);
  const Q=[];const T=204/282,D=(u,v)=>Math.hypot(u.x-v.x,u.y-v.y);   /* procura os 4 marcadores: retângulo com a proporção do bloco */
  for(let a=0;a<C.length;a++)for(let b=a+1;b<C.length;b++)for(let c=b+1;c<C.length;c++)for(let e=c+1;e<C.length;e++){
    const q=[C[a],C[b],C[c],C[e]],mx=q.reduce((t,p)=>t+p.x,0)/4,my=q.reduce((t,p)=>t+p.y,0)/4;
    q.sort((p,o)=>Math.atan2(p.y-my,p.x-mx)-Math.atan2(o.y-my,o.x-mx));
    let k=0;for(let i=1;i<4;i++)if(q[i].x+q[i].y<q[k].x+q[k].y)k=i;const P=[0,1,2,3].map(i=>q[(k+i)%4]);
    const wt=D(P[0],P[1]),wb=D(P[3],P[2]),hl=D(P[0],P[3]),hr=D(P[1],P[2]),lado=Math.sqrt(q.reduce((t,p)=>t+p.a,0)/4)/((wt+wb)/2);
    if(lado<.03||lado>.08)continue;
    const cr=i=>{const o=P[i],u=P[(i+1)%4],v=P[(i+2)%4];return(u.x-o.x)*(v.y-u.y)-(u.y-o.y)*(v.x-u.x)};
    if(!(cr(0)>0&&cr(1)>0&&cr(2)>0&&cr(3)>0))continue;
    const as=q.map(p=>p.a),err=Math.abs((wt+wb)/(hl+hr)/T-1)+Math.abs(wt-wb)/Math.max(wt,wb)+Math.abs(hl-hr)/Math.max(hl,hr)+(Math.max(...as)/Math.min(...as)-1)*.3;
    Q.push({e:err,P})}
  const amostra=P=>{
  const src=[[0,0],[204,0],[204,282],[0,282]],A=[],B=[];
  P.forEach((p,i)=>{const[u,v]=src[i];A.push([u,v,1,0,0,0,-u*p.x,-v*p.x]);B.push(p.x);A.push([0,0,0,u,v,1,-u*p.y,-v*p.y]);B.push(p.y)});
  const K=solve(A,B),pr=(u,v)=>{const z=K[6]*u+K[7]*v+1;return[(K[0]*u+K[1]*v+K[2])/z,(K[3]*u+K[4]*v+K[5])/z]};
  const gs=(x,y)=>{x=Math.min(w-2,Math.max(0,x));y=Math.min(H-2,Math.max(0,y));const i=x|0,j=y|0,a=x-i,b=y-j,o=j*w+i;return g[o]*(1-a)*(1-b)+g[o+1]*a*(1-b)+g[o+w]*(1-a)*b+g[o+w+1]*a*b};
  const esc=[];let ring=0;
  for(let q=0;q<10;q++){const row=[];for(let a=0;a<4;a++){const cu=56+40*a,cv=55.5+23*q;let t=0,n=0;
    for(let du=-5;du<=5;du+=1.25)for(let dv=-5;dv<=5;dv+=1.25)if(du*du+dv*dv<=25){const[x,y]=pr(cu+du,cv+dv);t+=gs(x,y);n++}
    const wv=[];for(let du=-16;du<=16;du+=4)for(let dv=-9;dv<=9;dv+=3){const[x,y]=pr(cu+du,cv+dv);wv.push(gs(x,y))}
    wv.sort((p,o)=>p-o);const wr=Math.max(1,wv[wv.length>>1]);let rt=0;for(let k=0;k<8;k++){const[x,y]=pr(cu+7.2*Math.cos(k*.785),cv+7.2*Math.sin(k*.785));rt+=gs(x,y)}ring+=1-rt/8/wr;row.push(Math.max(0,1-t/n/Math.max(1,wv[wv.length>>1])))}esc.push(row)}
  const resp=[],fl=[];
  esc.forEach(l=>{const mx=Math.max(...l),mk=l.map((v,i)=>v>=.18&&v>=.55*mx?i:-1).filter(i=>i>=0),so=[...l].sort((a,b)=>b-a);
    resp.push(!mk.length?'.':mk.length>1?'*':'ABCD'[mk[0]]);fl.push(mk.length!=1||mx<.3||(so[1]>.12&&so[1]>.4*mx))});
  if(ring/40<.18)return null;
  return{resp,fl}};
  Q.sort((a,b)=>a.e-b.e);for(const c of Q.slice(0,8)){if(c.e>.5)break;const r=amostra(c.P);if(r)return r}return null}
function lerImagem(im){const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),H=Math.round(im.height*k),c=document.createElement('canvas');
  c.width=w;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,w,H);return lerRGBA(x.getImageData(0,0,w,H).data,w,H)}

/* ---------- Telas ---------- */
function conf(){h(`<h1>Configuração</h1><label>Endereço do script (termina em /exec)</label><input id=u value="${cfg.url||''}" autocapitalize=off>
<label>Chave</label><input id=k type=password value="${cfg.chave||''}"><button onclick=salvaCfg()>Testar e salvar</button>${cfg.url?'<button class=g onclick=home()>Voltar</button>':''}`)}
async function salvaCfg(){const o=cfg;cfg={url:$('#u').value.trim(),chave:$('#k').value.trim()};
  try{const j=await api('ping');LS.cfg=JSON.stringify(cfg);msg('Conectado: '+j.planilha);home()}catch{cfg=o}}
async function home(){if(!cfg.url)return conf();h('<p>Carregando…</p>');
  try{const[t,s]=await Promise.all([api('turmas'),api('simulados')]);S.turmas=t.turmas;S.sims=s.simulados}catch{return conf()}
  if(!S.turmas.length||!S.sims.length)return h('<h1>Faltam dados</h1><p>Cadastre turmas (aba Turmas) e o gabarito do simulado (aba Gabaritos) na planilha.</p><button onclick=home()>Tentar de novo</button><button class=g onclick=conf()>⚙ Configuração</button>');
  h(`<h1>Correção de Gabaritos</h1><label>Turma</label><select id=tu>${S.turmas.map(x=>`<option>${x}</option>`).join('')}</select>
  <label>Simulado</label><select id=si onchange=tipos()>${S.sims.map(x=>`<option>${x.simulado}</option>`).join('')}</select>
  <label>Tipo da prova</label><div id=tp></div><button onclick=ini()>Iniciar leitura</button><button class=g onclick=conf()>⚙ Configuração</button>`);tipos()}
function tipos(){const s=S.sims.find(x=>x.simulado==$('#si').value);if(!s.tipos.includes(S.tipo))S.tipo=s.tipos[0];
  $('#tp').innerHTML=s.tipos.map(t=>`<button class="s ${t==S.tipo?'on':''}" onclick="S.tipo='${t}';tipos()">Tipo ${t}</button>`).join('')}
async function ini(){S.turma=$('#tu').value;S.sim=$('#si').value;S.cont=0;try{S.gab=(await api('gabarito',{simulado:S.sim})).tipos}catch{return}leitura()}
function leitura(){h(`<div class=bar><b>${S.turma}</b> · ${S.sim}<br><span class=badge>TIPO ${S.tipo}</span>${S.gab.map(g=>`<button class="s ${g.tipo==S.tipo?'on':''}" onclick="S.tipo='${g.tipo}';leitura()">${g.tipo}</button>`).join('')}
  <span style="float:right">${S.cont} lidas</span></div>
  <input id=f type=file accept="image/*" capture=environment hidden onchange=foto(this)><input id=f2 type=file accept="image/*" hidden onchange=foto(this)>
  <button onclick=f.click()>📷 Fotografar prova</button><button class=g onclick=f2.click()>Escolher da galeria</button>
  ${S.ult?'<button class=g onclick=desfaz()>↩ Desfazer última nota</button>':''}<button class=g onclick=home()>Trocar turma / simulado</button>
  <small>Folha na vertical, boa luz, sem sombra. Os 4 quadrados pretos do gabarito precisam aparecer na foto.</small>`)}
async function foto(i){const f=i.files[0];if(!f)return;msg('Lendo…');
  const im=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f));
  let r;try{r=lerImagem(im)}catch(e){r=null}i.value='';
  if(!r){h('<h1>Não consegui ler</h1><p>Não encontrei os 4 quadrados pretos do gabarito. Tente de novo mais perto, com a folha reta e sem sombra, mostrando o bloco inteiro.</p><button onclick=leitura()>Tirar outra foto</button>');return}
  S.r=r;res()}
const nota=g=>S.r.resp.reduce((a,l,i)=>a+(g.respostas[i]=='ANULADA'||l==g.respostas[i]),0);
function res(){const g=S.gab.find(x=>x.tipo==S.tipo),a=nota(g),o=S.gab.find(x=>x.tipo!=S.tipo),ao=o?nota(o):0,nt=Math.round(a/g.questoes*g.notaMax*100)/100;
  h(`<div class=bar><span class=badge>TIPO ${S.tipo}</span> <b>${a}/${g.questoes} · nota ${nt}</b></div>
  ${o&&ao-a>=4?`<div class=w>⚠ Esta folha combina mais com o tipo ${o.tipo} (${ao} acertos). Confira a pilha.</div>`:''}
  ${S.r.resp.map((l,i)=>`<div class="q ${S.r.fl[i]?'f':''}"><b>Q.${i+1}</b>${'ABCD'.split('').map(x=>`<button class="${l==x?'on':''}" onclick="ed(${i},'${x}')">${x}</button>`).join('')}<button class="${l=='.'||l=='*'?'on':''}" onclick="ed(${i},'.')">${l=='*'?'✱':'—'}</button></div>`).join('')}
  <small>Linhas amarelas: em branco, mais de uma marca ou marca fraca. Toque na letra para corrigir.</small>
  <button onclick=alunos()>Escolher aluno →</button><button class=g onclick=leitura()>Descartar e refazer foto</button>`)}
function ed(i,x){S.r.resp[i]=x;S.r.fl[i]=false;res()}
async function alunos(){let L;try{L=(await api('alunos',{turma:S.turma,simulado:S.sim})).alunos}catch{return}
  L.sort((a,b)=>a.jaTem-b.jaTem||a.nome.localeCompare(b.nome));S.L=L;
  h(`<h1>Quem é o aluno?</h1><input id=bs placeholder="Buscar nome…" oninput=lista()><div id=ls></div><button class=g onclick=res()>← Voltar</button>`);lista()}
function lista(){const b=($('#bs').value||'').toLowerCase();
  $('#ls').innerHTML=S.L.filter(a=>a.nome.toLowerCase().includes(b)).map(a=>`<button class="g al ${a.jaTem?'ok':''}" onclick="salva('${a.id}')"><span>${a.nome}</span><span>${a.jaTem?'✓ '+a.nota:''}</span></button>`).join('')}
async function salva(id,sub){let j;try{j=await api('salvarNota',{simulado:S.sim,tipo:S.tipo,id,respostas:S.r.resp.map(l=>l||'.').join(''),substituir:!!sub},true)}catch{return}
  if(j.conflito){if(confirm(`Este aluno já tem nota (${j.notaAnterior}). Substituir?`))return salva(id,true);return}
  S.ult={sim:S.sim,id};if(!j.substituiu)S.cont++;msg(`${j.aluno}: ${j.acertos} acertos · nota ${j.nota}`);leitura()}
async function desfaz(){if(!confirm('Apagar a última nota lançada?'))return;try{await api('excluirNota',{simulado:S.ult.sim,id:S.ult.id},true);S.cont=Math.max(0,S.cont-1);S.ult=null;msg('Nota apagada');leitura()}catch{}}
home();
</script></body></html>
