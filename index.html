  <div class=bar><b>Acerto por questão</b><small>Em amarelo, as questões com menos de 50% de acerto.</small>${barras(q.map(x=>({l:x.n,v:x.pct,lo:x.pct<50})),100,q.length<=15)}</div>`}
function relErros(q){return Object.keys(q.tipos).sort().map(t=>{const x=q.tipos[t];let m='',n=0;
  Object.keys(x.marcas).forEach(k=>{if(k!=x.correta&&x.marcas[k]>n){n=x.marcas[k];m=k}});
  return `<small>${['Tipo '+t,x.correta=='ANULADA'?'anulada':'certa '+x.correta,n?`erro mais comum ${m} (${n})`:'',x.branco?x.branco+' em branco':'',x.multi?x.multi+' com dupla marca':''].filter(Boolean).join(' · ')}</small>`}).join('')}
function relDesenha(){const e=$('#rr'),d=REL.d;if(!e||!d)return;
  if(!d.alunos){e.innerHTML='<p>Ainda não há notas lançadas para esta seleção.</p>';return}
  const qs=[...d.questoes];if(REL.ord=='erro')qs.sort((a,b)=>a.pct-b.pct||a.n-b.n);
  e.innerHTML=`<div class=bar><b>${d.alunos} aluno(s)</b> · média ${d.media} · maior ${d.maior} · menor ${d.menor}${d.faltam?`<small>Faltam ${d.faltam} aluno(s) sem nota${REL.turma?'':' (todas as turmas)'}.</small>`:''}</div>${graficos(d)}
  <div>${[['erro','Mais erradas'],['prova','Ordem da prova']].map(([k,t])=>`<button class="s ${REL.ord==k?'on':''}" onclick="REL.ord='${k}';relDesenha()">${t}</button>`).join('')}</div>
  ${qs.map(q=>`<div class=bar><div style="display:flex;justify-content:space-between"><b>Q.${q.n}</b><span>${q.pct}% acertaram</span></div><div class=tr><div class=fl style="width:${q.pct}%"></div></div>${relErros(q)}</div>`).join('')}
  <small>Os tipos A e B são somados por número de questão. Questão anulada conta como acerto para todos.</small>`}
/* ---------- Ajustes: turmas, alunos e notas ---------- */
const AJ=(a,t,r)=>`<button class="g al" onclick="${a}"><span>${t}</span><span>${r||'›'}</span></button>`;
function ajustes(){h(`<h1>Ajustes</h1>${AJ('turmasTela()','Turmas e alunos')}${AJ('conf()','Conexão com a planilha')}`,'ajustes')}
async function turmasTela(){let t,a;
  try{[t,a]=await Promise.all([api('turmas'),api('alunos',{turma:'',simulado:''})])}catch{return}
  S.turmas=t.turmas;S.todos=a.alunos;
  h(`<h1>Turmas e alunos</h1>${S.turmas.map(x=>`<button class="g al" data-t="${esc(x)}" onclick="alunosTurma(this.dataset.t)"><span>${esc(x)}</span><span>${S.todos.filter(y=>y.turma==x).length} aluno(s) ›</span></button>`).join('')||'<p>Nenhuma turma cadastrada.</p>'}
  <button onclick=novaTurma()>Nova turma</button><button class=g onclick=ajustes()>Voltar</button>`,'ajustes')}
async function novaTurma(){const n=(prompt('Nome da turma:')||'').trim();if(!n)return;
  try{await api('salvarTurma',{nome:n},true)}catch{return}msg('Turma criada');turmasTela()}
function alunosTurma(t){S.tt=t;const L=S.todos.filter(x=>x.turma==t).sort((a,b)=>a.nome.localeCompare(b.nome));
  h(`<h1>${esc(t)}</h1><small style="margin:-8px 0 8px">${L.length} aluno(s)</small>${L.map(a=>`<button class="g al" data-i="${esc(a.id)}" onclick="alunoEd(this.dataset.i)"><span>${esc(a.nome)}</span><span>›</span></button>`).join('')}
  <button onclick=alunosAdd()>Adicionar alunos</button>${L.length?'':'<button class=g onclick=turmaExclui()>Excluir esta turma</button>'}<button class=g onclick=turmasTela()>Voltar</button>`,'ajustes')}
async function recarrega(t){try{S.todos=(await api('alunos',{turma:'',simulado:''})).alunos}catch{return}alunosTurma(t)}
function alunosAdd(){h(`<h1>Adicionar alunos</h1><small style="margin:-8px 0 8px">Turma ${esc(S.tt)}</small><textarea id=nn rows=10 placeholder="Um nome por linha (pode colar a lista da turma)"></textarea>
  <button onclick=alunosSalva()>Salvar</button><button class=g onclick="alunosTurma(S.tt)">Voltar</button>`,'ajustes')}
async function alunosSalva(){const nomes=$('#nn').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!nomes.length)return msg('Digite pelo menos um nome.');
  let j;try{j=await api('salvarAluno',{turma:S.tt,nomes},true)}catch{return}
  msg(j.adicionados+' aluno(s) adicionado(s)'+(j.ignorados.length?'; '+j.ignorados.length+' já existiam':''));recarrega(S.tt)}
function alunoEd(id){const a=S.todos.find(x=>x.id==id);S.ae=a;
  h(`<h1>Aluno</h1><label>Nome</label><input id=an value="${esc(a.nome)}"><label>Turma</label><select id=at>${S.turmas.map(x=>`<option ${x==a.turma?'selected':''}>${esc(x)}</option>`).join('')}</select>
  <button onclick=alunoSalva()>Salvar</button><button class=g onclick=alunoExclui()>Excluir aluno</button><button class=g onclick="alunosTurma(S.tt)">Voltar</button>`,'ajustes')}
async function alunoSalva(){const t=$('#at').value;try{await api('salvarAluno',{id:S.ae.id,nome:$('#an').value,turma:t},true)}catch{return}msg('Aluno atualizado');recarrega(t)}
async function alunoExclui(){const a=S.ae;if(!confirm(`Excluir ${a.nome}?`))return;let j;
  try{j=await api('excluirAluno',{id:a.id},true);
    if(j.temNotas){if(!confirm(`${a.nome} tem ${j.temNotas} nota(s) lançada(s). Excluir o aluno e apagar essas notas?`))return;j=await api('excluirAluno',{id:a.id,apagarNotas:true},true)}}catch{return}
  msg('Aluno excluído');recarrega(S.tt)}
async function turmaExclui(){if(!confirm(`Excluir a turma ${S.tt}?`))return;try{await api('excluirTurma',{nome:S.tt},true)}catch{return}msg('Turma excluída');turmasTela()}

let NT={turma:'',sim:'',oa:'nome',A:[],N:[]},NE={};
async function notasTela(){
  if(!S.turmas||!S.sims){try{const[t,s]=await Promise.all([lerC('turmas'),lerC('simulados')]);S.turmas=t.turmas;S.sims=s.simulados}catch{return}}
  if(!S.turmas.length)return h('<h1>Notas</h1><p>Você ainda não tem turmas. Cadastre a turma e os alunos para começar.</p><button onclick=turmasTela()>Cadastrar turma e alunos</button>','notas');
  if(!S.sims.length)return h('<h1>Notas</h1><p>Cadastre um gabarito e corrija algumas provas para ver as notas.</p><button onclick=gabNovo()>Cadastrar gabarito</button>','notas');
  if(!S.sims.some(x=>x.simulado==NT.sim))NT.sim=S.sims[0].simulado;
  h(`<h1>Notas</h1><label>Turma</label><select onchange="NT.turma=this.value;notasCarrega()"><option value="">Todas as turmas</option>${S.turmas.map(x=>`<option ${x==NT.turma?'selected':''}>${esc(x)}</option>`).join('')}</select>
  <label>Simulado</label><select onchange="NT.sim=this.value;notasCarrega()">${S.sims.map(x=>`<option ${x.simulado==NT.sim?'selected':''}>${esc(x.simulado)}</option>`).join('')}</select><div id=nl><p>Carregando…</p></div>`,'notas');notasCarrega()}
async function notasCarrega(){let a,n;
  try{[a,n]=await Promise.all([lerC('alunos',{turma:NT.turma,simulado:NT.sim}),lerC('notas',{simulado:NT.sim,turma:NT.turma})])}catch{const e=$('#nl');if(e)e.innerHTML='<p>Não foi possível carregar as notas.</p>';return}
  NT.A=a.alunos.map(x=>({...x}));NT.N=n.notas;
  FILA.forEach(q=>{if(q.sim==NT.sim){const x=NT.A.find(y=>y.id==q.id);if(x){x.jaTem=true;x.nota='na fila'}}});
  notasDesenha()}
function notasDesenha(){const e=$('#nl'),L=NT.A;if(!e)return;
  if(!L.length){e.innerHTML='<p>Nenhum aluno cadastrado nesta seleção.</p><button onclick=turmasTela()>Cadastrar alunos</button>';return}
  const num=a=>typeof a.nota=='number',ns=L.filter(num).map(a=>a.nota),med=ns.length?Math.round(ns.reduce((x,y)=>x+y,0)/ns.length*100)/100:null;
  const R=[...L].sort((a,b)=>{if(NT.oa=='nota'&&num(a)!=num(b))return num(a)?-1:1;if(NT.oa=='nota'&&num(a)&&a.nota!=b.nota)return b.nota-a.nota;return a.nome.localeCompare(b.nome)});
  e.innerHTML=`<div class=bar><b>${ns.length} de ${L.length} com nota</b>${ns.length?` · média ${med} · maior ${Math.max(...ns)} · menor ${Math.min(...ns)}`:''}</div>
  <div>${[['nome','Por nome'],['nota','Por nota']].map(([k,t])=>`<button class="s ${NT.oa==k?'on':''}" onclick="NT.oa='${k}';notasDesenha()">${t}</button>`).join('')}<button class=s onclick=expTela()>Exportar</button></div>
  ${R.map(a=>`<button class="g al ${a.jaTem?'':'ok'}" data-i="${esc(a.id)}" onclick="notaAbre(this.dataset.i)"><span>${esc(a.nome)}<small style="display:inline;margin:0 0 0 8px">${[!NT.turma&&a.turma,a.jaTem&&a.tipo&&'tipo '+a.tipo].filter(Boolean).map(esc).join(' · ')}</small></span><span>${a.jaTem?a.nota+' ›':'sem nota'}</span></button>`).join('')}
  <small>Toque em um aluno para corrigir as respostas, trocar o tipo ou apagar a nota.</small>`}
function notaAbre(id){const n=NT.N.find(x=>x.id==id);if(!n)return msg('Este aluno ainda não tem nota enviada neste simulado.');NE={n,tipo:n.tipo,resp:n.respostas.split('')};notaDes()}
function neLinha(k){const l=NE.resp[k];return `<div id=nq${k} class=q><b>Q.${k+1}</b>${'ABCD'.split('').map(x=>`<button class="${l==x?'on':''}" onclick="neEd(${k},'${x}')">${x}</button>`).join('')}<button class="${l=='.'||l=='*'?'on':''}" onclick="neEd(${k},'.')">${l=='*'?'✱':'—'}</button></div>`}
function notaDes(){const n=NE.n,ts=(S.sims.find(x=>x.simulado==NT.sim)||{tipos:[n.tipo]}).tipos;
  h(`<h1>${esc(n.nome)}</h1><small style="margin:-8px 0 8px">${esc(NT.sim)} · nota atual ${n.nota}</small><div>${ts.map(t=>`<button class="s ${t==NE.tipo?'on':''}" onclick="NE.tipo='${t}';notaDes()">Tipo ${t}</button>`).join('')}</div>
  ${NE.resp.map((l,k)=>neLinha(k)).join('')}<small>Toque na letra para corrigir. A nota é recalculada ao salvar.</small>
  <button onclick=neSalva()>Salvar correção</button><button class=g onclick=neApaga()>Apagar esta nota</button><button class=g onclick=notasTela()>Voltar</button>`,'notas')}
function neEd(k,x){NE.resp[k]=x;$('#nq'+k).outerHTML=neLinha(k)}
async function neSalva(){const n=NE.n;let j;try{j=await api('salvarNota',{simulado:NT.sim,tipo:NE.tipo,id:n.id,respostas:NE.resp.join(''),substituir:true},true)}catch{return}
  msg(`${j.aluno}: ${j.acertos} acertos · nota ${j.nota}`);notasTela()}
async function neApaga(){const n=NE.n;if(!confirm(`Apagar a nota de ${n.nome}?`))return;try{await api('excluirNota',{simulado:NT.sim,id:n.id},true)}catch{return}msg('Nota apagada');notasTela()}
/* ---------- Exportar e compartilhar as notas ---------- */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const E=new TextEncoder(),parts=[],cen=[];let off=0;
  const w16=(a,v)=>a.push(v&255,(v>>8)&255),w32=(a,v)=>a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255);
  files.forEach(f=>{const nm=E.encode(f.n),crc=crc32(f.d),h=[],c=[];
    w32(h,0x04034b50);w16(h,20);w16(h,0x0800);w16(h,0);w16(h,0);w16(h,0x21);w32(h,crc);w32(h,f.d.length);w32(h,f.d.length);w16(h,nm.length);w16(h,0);
    parts.push(new Uint8Array(h),nm,f.d);
    w32(c,0x02014b50);w16(c,20);w16(c,20);w16(c,0x0800);w16(c,0);w16(c,0);w16(c,0x21);w32(c,crc);w32(c,f.d.length);w32(c,f.d.length);w16(c,nm.length);w16(c,0);w16(c,0);w16(c,0);w16(c,0);w32(c,0);w32(c,off);
    cen.push(new Uint8Array(c),nm);off+=h.length+nm.length+f.d.length});
  const cs=cen.reduce((a,b)=>a+b.length,0),e=[];w32(e,0x06054b50);w16(e,0);w16(e,0);w16(e,files.length);w16(e,files.length);w32(e,cs);w32(e,off);w16(e,0);
  return new Blob([...parts,...cen,new Uint8Array(e)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xlsx(linhas){const col=i=>String.fromCharCode(65+i),x=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),E=new TextEncoder(),H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',N='http://schemas.openxmlformats.org/',f=(n,t)=>({n,d:E.encode(H+t)});
  const rows=linhas.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>typeof v=='number'?`<c r="${col(j)}${i+1}"><v>${v}</v></c>`:`<c r="${col(j)}${i+1}" t="inlineStr"><is><t>${x(v)}</t></is></c>`).join('')}</row>`).join('');
  return zip([f('[Content_Types].xml',`<Types xmlns="${N}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`),
   f('_rels/.rels',`<Relationships xmlns="${N}package/2006/relationships"><Relationship Id="rId1" Type="${N}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
   f('xl/workbook.xml',`<workbook xmlns="${N}spreadsheetml/2006/main" xmlns:r="${N}officeDocument/2006/relationships"><sheets><sheet name="Notas" sheetId="1" r:id="rId1"/></sheets></workbook>`),
   f('xl/_rels/workbook.xml.rels',`<Relationships xmlns="${N}package/2006/relationships"><Relationship Id="rId1" Type="${N}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`),
   f('xl/worksheets/sheet1.xml',`<worksheet xmlns="${N}spreadsheetml/2006/main"><cols><col min="1" max="1" width="38" customWidth="1"/><col min="2" max="3" width="14" customWidth="1"/></cols><sheetData>${rows}</sheetData></worksheet>`)])}
const vir=n=>String(n).replace('.',',');
function expDados(){const L=[...NT.A].sort((a,b)=>a.nome.localeCompare(b.nome));
  return{tit:NT.sim+(NT.turma?' - '+NT.turma:''),linhas:[['Nome','Turma','Nota'],...L.map(a=>[a.nome,a.turma||'',typeof a.nota=='number'?a.nota:''])]}}
const expTxt=(sep,tit)=>{const d=expDados();return(tit?d.tit+'\n':'')+d.linhas.slice(1).map(r=>r[0]+sep+(r[2]===''?'sem nota':vir(r[2]))).join('\n')};
function expTela(){const d=expDados();
  h(`<h1>Exportar notas</h1><small style="margin:-8px 0 8px">${esc(d.tit)} · ${d.linhas.length-1} aluno(s)</small>
  <button onclick=expCopia()>Copiar lista (nome e nota)</button><button class=g onclick=expTexto()>Compartilhar lista</button>
  <button class=g onclick=expXlsx()>Planilha (.xlsx)</button><button class=g onclick=expCsv()>Arquivo .csv</button><button class=g onclick=expPdf()>PDF / imprimir</button>
  <small>A cópia usa nome e nota separados por tabulação: cole direto em uma planilha ou leia para digitar no sistema da escola. Alunos sem nota aparecem como "sem nota".</small>
  <button class=g onclick=notasTela()>Voltar</button>`,'notas')}
async function expCopia(){try{await navigator.clipboard.writeText(expTxt('\t'));msg('Lista copiada.')}catch(e){msg('Não consegui copiar. Use "Compartilhar lista".')}}
async function expTexto(){try{if(navigator.share){await navigator.share({title:expDados().tit,text:expTxt(' - ',1)});return}}catch(e){if(e.name=='AbortError')return}expCopia()}
async function expArq(blob,nome){const f=new File([blob],nome,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nome});return}}catch(e){if(e.name=='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg('Arquivo baixado.')}
const expNome=ext=>('Notas - '+expDados().tit).replace(/[\\/:*?"<>|]/g,'')+'.'+ext;
const expXlsx=()=>expArq(xlsx(expDados().linhas),expNome('xlsx'));
function expCsv(){const q=v=>typeof v=='number'?vir(v):'"'+String(v).replace(/"/g,'""')+'"';
  expArq(new Blob(['\uFEFF'+expDados().linhas.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),expNome('csv'))}
function expPdf(){const d=expDados();let pr=$('#pr');if(!pr){pr=document.createElement('div');pr.id='pr';document.body.appendChild(pr)}
  pr.innerHTML=`<h2>${esc(d.tit)}</h2><table>${d.linhas.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${esc(typeof c=='number'?vir(c):c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table>`;
  const lim=()=>{pr.innerHTML='';removeEventListener('afterprint',lim)};addEventListener('afterprint',lim);window.print()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('online',()=>sincroniza());
home().then(()=>sincroniza());
</script></body></html>
